{% extends "layout.html" %}

{% block title %}
Buat Delivery Order
{% endblock %}

{% block page_title %}
Buat Delivery Order
{% endblock %}

{% block content %}

<div class="page-card">

<div class="d-flex justify-content-between align-items-center mb-4">

<div>

<h3 class="mb-0">
📦 Buat Delivery Order
</h3>

<small class="text-muted">
Pilih agen tujuan pengiriman
</small>

</div>

<a href="/do"
class="btn btn-secondary">

← Kembali

</a>

</div>

<form method="POST">

<div class="row">

<div class="col-md-8 mb-3">

<label class="form-label fw-bold">

Agen

</label>

<select
name="agent_id"
class="form-select"
required>

<option value="">
-- Pilih Agen --
</option>

{% for a in agents %}

<option value="{{ a.id }}">
{{ a.nama_agen }}
</option>

{% endfor %}

</select>

</div>

</div>

<hr>

<div class="d-flex justify-content-end gap-2">

<a href="/do"
class="btn btn-secondary">

Batal

</a>

<button
type="submit"
class="btn btn-primary">

💾 Buat DO

</button>

</div>

</form>

</div>

{% endblock %}
