{% extends "layout.html" %}

{% block title %}
Edit Barang DO
{% endblock %}

{% block page_title %}
Edit Barang DO
{% endblock %}

{% block content %}

<div class="page-card">

<form method="POST">

<div class="mb-3">

<label>Qty</label>

<input
type="number"
name="qty"
value="{{ detail.qty }}"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Harga Jual</label>

<input
type="number"
name="harga_jual"
value="{{ detail.harga_jual }}"
class="form-control"
required>

</div>

<button
type="submit"
class="btn btn-success">

Simpan

</button>

</form>

</div>

{% endblock %}
