<!DOCTYPE html>
<html>
<head>
<title>Tambah Stock Opname</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

<div class="container mt-4">

<h2>Tambah Stock Opname</h2>

<form method="POST">

<label>Produk</label>

<select
name="product_id"
class="form-control">

{% for p in products %}

<option value="{{ p.id }}">
{{ p.nama_barang }}
</option>

{% endfor %}

</select>

<br>

<label>Stok Fisik</label>

<input
type="number"
name="stok_fisik"
class="form-control"
required>

<br>

<label>Keterangan</label>

<textarea
name="keterangan"
class="form-control"
rows="3"
placeholder="Contoh: Barang rusak, selisih stok, hasil audit">
</textarea>

<br>

<button
class="btn btn-primary">

Simpan

</button>

</form>

</div>

</body>
</html>
