{% extends "layout.html" %}

{% block title %}
Tambah Barang DO
{% endblock %}

{% block page_title %}
Tambah Barang Delivery Order
{% endblock %}

{% block content %}

<div class="page-card">

<div class="d-flex justify-content-between align-items-center mb-4">

<div>

<h3 class="mb-0">
📦 Tambah Barang Delivery Order
</h3>

<small class="text-muted">
Tambahkan produk ke Delivery Order
</small>

</div>

<a href="javascript:history.back()"
class="btn btn-secondary">

← Kembali

</a>

</div>

<form method="POST">

<div class="row">

<div class="col-md-12 mb-3">

<label class="form-label fw-bold">

Scan Barcode

</label>

<input
type="text"
id="barcode"
class="form-control"
placeholder="Scan barcode di sini">

</div>

<div class="col-md-12 mb-3">

<label class="form-label fw-bold">

Produk

</label>

<select
id="product_id"
name="product_id"
class="form-select">

{% for p in products %}

<option value="{{ p.id }}">
{{ p.nama_barang }}
</option>

{% endfor %}

</select>

</div>

<div class="col-md-4 mb-3">

<label class="form-label fw-bold">

Qty

</label>

<input
type="number"
name="qty"
class="form-control"
required
min="1">

</div>

</div>

<hr>

<div class="d-flex justify-content-end">

<button
type="submit"
class="btn btn-success">

💾 Simpan Barang

</button>

</div>

</form>

</div>

{% endblock %}

{% block script %}

<script>

document
.getElementById("barcode")
.addEventListener(
    "change",
    function(){

        let barcode = this.value;

        fetch(
            `/api/product-by-barcode/${barcode}`
        )

        .then(response => response.json())

        .then(data => {

            if(data.success){

                document
                .getElementById("product_id")
                .value = data.id;

            }
            else{

                alert(
                    "Barcode tidak ditemukan"
                );

            }

        });

    }
);

</script>

{% endblock %}
