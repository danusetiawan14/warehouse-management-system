<!DOCTYPE html>
<html>
<head>

<title>Kartu Stok</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-4">

<h2>Kartu Stok</h2>

<h4>

{{ product.sku }}

-

{{ product.nama_barang }}

</h4>

<a href="/products"
class="btn btn-primary">
Kembali
</a>

<hr>

<table class="table table-bordered">

<tr>
<th>Tanggal</th>
<th>Jenis</th>
<th>Qty</th>
<th>Keterangan</th>
</tr>

{% for h in history %}

<tr>

<td>{{ h.tanggal }}</td>

<td>{{ h.jenis }}</td>

<td>{{ h.qty }}</td>

<td>{{ h.keterangan }}</td>

</tr>

{% endfor %}

</table>

</div>

</body>

</html>
