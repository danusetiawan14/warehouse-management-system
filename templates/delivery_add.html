<!DOCTYPE html>
<html>
<head>

<title>Barang Keluar</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

<div class="container mt-4">

<h2>Barang Keluar</h2>

<form method="POST">

<label>Agen</label>

<select name="agent_id" class="form-control">

{% for a in agents %}

<option value="{{ a.id }}">
{{ a.nama_agen }}
</option>

{% endfor %}

</select>

<br>

<label>Produk</label>

<select name="product_id" class="form-control">

{% for p in products %}

<option value="{{ p.id }}">
{{ p.nama_barang }} (Stok: {{ p.stok }})
</option>

{% endfor %}

</select>

<br>

<label>Qty Keluar</label>

<input type="number"
       name="qty"
       class="form-control">

<br>

<button class="btn btn-danger">
Simpan Pengiriman
</button>

</form>

</div>

</body>
</html>
