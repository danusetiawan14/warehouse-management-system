<!DOCTYPE html>
<html>

<head>

<title>Laporan Stok</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

@media print {

    .btn {
        display: none;
    }

}

</style>

</head>

<body>

<div class="container mt-4">

<h2>Laporan Stok Barang</h2>

<a href="/" class="btn btn-primary">
Dashboard
</a>

<button
onclick="window.print()"
class="btn btn-success">
Cetak
</button>

<a href="/report/stock/excel"
class="btn btn-warning no-print">
Export Excel
</a>

<hr>

<table class="table table-bordered table-striped">

<thead>

<tr>
<th>SKU</th>
<th>Nama Barang</th>
<th>Kategori</th>
<th>Stok</th>
<th>Minimum</th>
<th>Lokasi</th>
</tr>

</thead>

<tbody>

{% for p in products %}

<tr>

<td>{{ p.sku }}</td>
<td>{{ p.nama_barang }}</td>
<td>{{ p.kategori }}</td>
<td>{{ p.stok }}</td>
<td>{{ p.stok_minimum }}</td>
<td>{{ p.lokasi_rak }}</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</body>

</html>
